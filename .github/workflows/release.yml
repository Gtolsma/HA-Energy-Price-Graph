name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest version and changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version custom_components/energy_price_graph/manifest.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Release tag ($TAG) does not match manifest.json version ($MANIFEST). Bump the version in manifest.json first."
            exit 1
          fi
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $TAG."
            exit 1
          fi

      - name: Build zip
        run: |
          cd custom_components/energy_price_graph
          zip -r "$GITHUB_WORKSPACE/energy_price_graph.zip" . -x "__pycache__/*"

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" energy_price_graph.zip --clobber

      - name: Release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # The section of this version: from its heading up to the next one.
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          # Keep notes that were written by hand when publishing the release.
          BODY=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          if [ -n "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "Release already has notes, leaving them as they are."
          elif [ -s notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi
